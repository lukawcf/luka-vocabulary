<title>Luka Vocabulary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E4E8F0; --ink:#16213A; --muted:#5B6478; --line:#D5DBE6;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --amber:#B7790F; --good:#1E8E5A; --good-bg:#E3F4EA;
  --bad:#8A5A2B; --bad-bg:#F5EBDD;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --body:"Noto Sans SC",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0F1420;--surface:#182033;--sunk:#111829;--ink:#E8ECF5;--muted:#9AA3B8;--line:#2A3450;
  --accent:#7C9BFF;--accent-ink:#0F1420;--amber:#F2B94A;--good:#5FD39A;--good-bg:#153326;--bad:#E0B07E;--bad-bg:#33261A;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0F1420;--surface:#182033;--sunk:#111829;--ink:#E8ECF5;--muted:#9AA3B8;--line:#2A3450;
  --accent:#7C9BFF;--accent-ink:#0F1420;--amber:#F2B94A;--good:#5FD39A;--good-bg:#153326;--bad:#E0B07E;--bad-bg:#33261A;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--body);padding:24px 16px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:22px;font-weight:800}
h2{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;font:16px/1.5 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;min-height:76px}
.tag{font:500 11px var(--mono);letter-spacing:.08em;padding:3px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.new{color:var(--accent)}
.tag.bonus{color:var(--amber)}
.word{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.01em;line-height:1.1;overflow-wrap:anywhere}
.speak{display:inline-flex;align-items:center;gap:6px}
.speak svg{width:16px;height:16px}
.meaning{font-size:17px}
.sub{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.list{display:flex;flex-direction:column}
.list > div{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.list > div:first-child{border-top:0}
.e{font-size:22px;line-height:1.3}
.notes{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;border-radius:10px}
.verdict.good{background:var(--good-bg)}
.verdict.bad{background:var(--bad-bg)}
.big{font-size:60px;line-height:1;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.big{animation:none}}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--sunk);color:var(--muted)}
.done-mark{font-size:48px}
@media (max-width:480px){.word{font-size:32px}.panel{padding:18px}}
</style>

const NEW_PER_DAY = 20, REVIEW_PER_DAY = 20, BONUS_PER_HOUR = 5;
const KEY = "wordforge-v1";

/* ---------------- state ---------------- */
const BANK_VERSION = "ielts3000-v1";
function shuffled(list){
  const a = list.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
const ieltsBank = () => shuffled(IELTS.map(([w,m])=>({w,m})));
function freshState(){ return {bankVersion:BANK_VERSION, bank:ieltsBank(), cards:{}, plan:null, bonus:null}; }
let S;
try{
  const saved = JSON.parse(localStorage.getItem(KEY)||"null");
  if(!saved) S = freshState();
  else{
    S = Object.assign(freshState(), saved);
    if(saved.bankVersion !== BANK_VERSION){
      // switch to the shuffled IELTS bank; keep older words (learned or imported) at the end so their meanings stay
      const bank = ieltsBank(), have = new Set(bank.map(x=>x.w.toLowerCase()));
      (saved.bank||[]).forEach(x=>{ if(!have.has(x.w.toLowerCase())) bank.push(x); });
      S.bank = bank; S.bankVersion = BANK_VERSION;
      try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    }
  }
}catch(e){ S = freshState(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dayNum(d=new Date()){ return Math.floor(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime()/864e5); }
function hourKey(d=new Date()){ return dayNum(d)+"-"+d.getHours(); }
const meaningOf = w => (S.bank.find(x=>x.w===w)||{}).m || "";

/* ---------------- spaced repetition (SM-2) ----------------
   Quality comes from how the word went today:
   item.level: 0 = wrote the sentence without looking, 2 = looked at the Chinese meaning
   5/3 = flower on first try at level 0/2
   3 = one poop before the flower
   2 = two or more poops  -> forgotten, start the interval over
   Intervals: 1 day, 3 days, then previous interval x ease factor. */
function schedule(card, item){
  const lv = item.level||0;
  let q = item.poops===0 ? 5-lv : item.poops===1 ? Math.min(3, 5-lv) : 2;
  if(item.kind==="new") q = Math.min(q, 4);
  const today = dayNum();
  if(q < 3){ card.reps = 0; card.interval = 1; card.lapses = (card.lapses||0)+1; }
  else{
    card.reps = (card.reps||0)+1;
    card.interval = card.reps===1 ? 1 : card.reps===2 ? 3 : Math.round((card.interval||3) * card.ease);
  }
  card.ease = Math.max(1.3, card.ease + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
  card.due = today + card.interval;
  card.last = today;
}

/* ---------------- today's plan ---------------- */
function ensurePlan(){
  const today = dayNum();
  if(S.plan && S.plan.day === today) return;
  const due = Object.values(S.cards).filter(c=>c.due<=today).sort((a,b)=>a.due-b.due || a.ease-b.ease).slice(0, REVIEW_PER_DAY);
  const fresh = S.bank.filter(x=>!S.cards[x.w]).slice(0, NEW_PER_DAY);
  S.plan = {day:today, items:[
    ...due.map(c=>({w:c.w, kind:"review", poops:0, peeked:false, done:false, tries:[]})),
    ...fresh.map(x=>({w:x.w, kind:"new", poops:0, peeked:false, done:false, tries:[]}))
  ]};
  save();
}
function ensureBonus(){
  const k = hourKey();
  if(S.bonus && S.bonus.key === k) return;
  const today = dayNum();
  const inPlan = new Set(S.plan.items.map(i=>i.w));
  const pool = Object.values(S.cards).filter(c=>!inPlan.has(c.w) && !c.bonusDay?.includes?.(today))
    .sort((a,b)=>a.due-b.due || a.ease-b.ease).slice(0, BONUS_PER_HOUR);
  S.bonus = {key:k, items:pool.map(c=>({w:c.w, kind:"bonus", poops:0, peeked:false, done:false, tries:[]}))};
  save();
}
function current(){
  ensurePlan();
  const p = S.plan.items.find(i=>!i.done);
  if(p) return {item:p, list:"plan"};
  ensureBonus();
  const b = S.bonus.items.find(i=>!i.done);
  if(b) return {item:b, list:"bonus"};
  return null;
}

/* ---------------- American pronunciation ---------------- */
let usVoice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    const pref = ["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Guy","Microsoft Zira","Microsoft David","Alex","Ava","Allison","Tom"];
    usVoice = pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean) || vs[0] || null;
  }catch(e){}
}
try{ pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); }catch(e){}
function speak(text, rate=0.85){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; if(usVoice) u.voice = usVoice; u.rate = rate;
    speechSynthesis.speak(u);
  }catch(e){}
}

  return "AI 暂时没响应，再提交一次试试";

async function judge(word, meaning, sentence){
  const prompt = `You are grading one sentence written by a Chinese learner of spoken English. The learner was asked to make up their own sentence using a target word.

Target word: "${word}" (meaning: ${meaning})
Learner's sentence: """${sentence}"""

Decide:
- "good" if the sentence uses the target word (any inflected form) correctly, is grammatical, and sounds like something an American native speaker would naturally say. Simple sentences are fine and should pass.
- "bad" if it has any grammar error, misuses the target word, does not contain the target word, or sounds unnatural.

Feedback rules:
- Every note in Simplified Chinese, short and specific.
- Say WHERE the problem is and WHAT kind it is. NEVER write the corrected sentence and never give the replacement words. A hint question is fine.
- For "good": issues is [] and praise is one short encouraging Chinese sentence. For "bad": praise is "".

Reply with only JSON: {"verdict":"good"|"bad","issues":[{"type":"grammar"|"naturalness"|"usage","note":"..."}],"praise":"..."}`;
  const r = await sample.json(prompt, {modelTier:"quick"});
  return {
    verdict: r && r.verdict==="good" ? "good" : "bad",
    issues: Array.isArray(r?.issues) ? r.issues.slice(0,4).map(x=>({type:String(x.type||""), note:String(x.note||"")})) : [],
    praise: String(r?.praise||"")
  };
}

  $("#mode").textContent = !cur ? "" : cur.list==="plan" ? "今日学习" : `今日任务已完成 · 加练，${nextRefresh()} 刷新下一批`;
  if(!cur){
    const planned = S.plan.items.length > 0;
    const anyCards = Object.keys(S.cards).length > 0;
    $("#view").innerHTML = `<div class="panel" style="align-items:flex-start">
      <div class="done-mark" aria-hidden="true">🌸</div>
      <h2>${planned || anyCards ? "今天的单词都完成了" : "3000 个雅思词都学完了"}</h2>
      <p class="muted">${anyCards ? `这一小时的加练也做完了。${nextRefresh()} 会刷新 ${BONUS_PER_HOUR} 个加练单词。` : ""}</p>
    </div>`;
    return;
  }
  const {item} = cur;
  const card = S.cards[item.w];
  const meaning = meaningOf(item.w);
  const past = (card?.flowers||[]).filter(f=>!item.tries.some(t=>t.sentence===f.s && t.verdict==="good"));
  const tries = item.tries.slice().reverse();
  const latest = tries[0];
  $("#view").innerHTML = `<div class="panel">
    <div class="row spread"><span class="tag ${item.kind}">${KIND[item.kind]}</span></div>
    <div class="row spread" style="align-items:flex-end">
      <div class="word">${esc(item.w)}</div>
      <button class="btn speak" data-act="say" aria-label="美式发音">${SPEAKER}美式发音</button>
    </div>
    ${meaningHTML(item, meaning)}
    ${past.length ? `<div><p class="sub">之前拿到 🌸 的句子</p><div class="list">${past.map(f=>`<div><span class="e">🌸</span><p>${esc(f.s)}</p></div>`).join("")}</div></div>` : ""}
    <textarea id="sent" placeholder="用 ${esc(item.w)} 自己造一个句子${past.length ? "，不要和之前的一样" : ""}">${esc(item.draft||"")}</textarea>
    <div class="row spread">
      <span class="muted small" id="aistate"></span>
      <div class="row">
        <button class="btn speak" id="micBtn" data-act="mic" aria-label="语音输入">${MIC}<span>语音输入</span></button>
        <button class="btn primary" id="submit" data-act="submit">交给 AI 判</button>
      </div>
    </div>
    <p class="note" id="dictTip" hidden>${dictationTip()}</p>
    ${latest ? verdictHTML(latest) : ""}
    ${tries.length > 1 ? `<div><p class="sub">这次写过的句子</p><div class="list">${tries.slice(1).map(t=>`<div><span class="e">${t.verdict==="good"?"🌸":"💩"}</span><p>${esc(t.sentence)}</p></div>`).join("")}</div></div>` : ""}
  </div>`;
  syncAi();
  if(interacted && lastSpoken !== item.w){ lastSpoken = item.w; speak(item.w); }
}
/* ---------------- voice input ----------------
   Uses the browser's speech recognition (American English) where the page may use the microphone.
   Inside claude.ai the page is sandboxed and the microphone is blocked, so we fall back to the
   operating system's dictation, which types into the text box like a keyboard. */
const MIC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
function dictationTip(){
  const ua = navigator.userAgent;
  const how = /iPhone|iPad|Android/i.test(ua) ? "点手机键盘上的麦克风图标"
    : /Mac/i.test(ua) ? "连按两下 Fn 键（或 🌐 键）打开听写"
    : "按 Win + H 打开 Windows 语音输入";
  return `当前页面没法直接用麦克风。点一下造句框，然后${how}，说英语就会自动打进框里。记得把听写语言设成英语（美国）。`;
}
let rec = null, micBlocked = false;
function showTip(){ const t = $("#dictTip"); if(t) t.hidden = false; $("#sent")?.focus(); }
function setMicUi(on){
  const b = $("#micBtn"); if(!b) return;
  b.classList.toggle("primary", on);
  b.querySelector("span").textContent = on ? "停止" : "语音输入";
}
function toggleMic(){
  if(rec){ rec.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR || micBlocked){ showTip(); return; }
  const box = $("#sent"); if(!box) return;
  const base = box.value ? box.value.replace(/\s*$/," ") : "";
  let r;
  try{ r = new SR(); }catch(e){ micBlocked = true; showTip(); return; }
  r.lang = "en-US"; r.interimResults = true; r.continuous = true;
  r.onresult = ev=>{
    let text = "";
    for(const res of ev.results) text += res[0].transcript;
    const b = $("#sent"); if(!b) return;
    b.value = base + text.trim();
    const cur = current(); if(cur){ cur.item.draft = b.value; save(); }
  };
  r.onerror = ev=>{
    if(["not-allowed","service-not-allowed","audio-capture"].includes(ev.error)){ micBlocked = true; showTip(); }
  };
  r.onend = ()=>{ rec = null; setMicUi(false); };
  try{ r.start(); rec = r; setMicUi(true); }catch(e){ micBlocked = true; showTip(); }
}

/* Meaning stays hidden until the learner taps 看中文. What is on screen is not saved
   (a refresh hides it again); that they looked is saved in item.level for scheduling. */
let revealed = null;
function meaningHTML(item, meaning){
  if(revealed === item.w) return `<p class="meaning">${esc(meaning)}</p>`;
  return `<div class="row"><button class="btn" data-act="show">看中文</button></div>`;
}
function verdictHTML(t){
  const good = t.verdict==="good";
  return `<div class="verdict ${good?"good":"bad"}">
    <div class="big" aria-label="${good?"好句子":"有问题"}">${good?"🌸":"💩"}</div>
    <div>
      <p><b>${esc(t.sentence)}</b></p>
      ${t.praise ? `<p>${esc(t.praise)}</p>` : ""}
      ${t.issues.length ? `<ul class="notes">${t.issues.map(x=>`<li><b>${esc(TYPE[x.type]||"提示")}</b>：${esc(x.note)}</li>`).join("")}</ul>` : ""}
      ${good ? `<p class="small muted">马上进入下一个单词…</p>` : `<p class="small muted">自己改完再提交一次。</p>`}
    </div>
  </div>`;
}

/* ---------------- settings: backup & Skill export ----------------
   Same backup format as the GitHub Pages version ({app:"wordforge", v:1, state}), so progress
   moves both ways. Files are offered through the platform's downloads capability; where that
   is unavailable the text is shown for copying instead. */
let view = "learn";
let downloads;
(async()=>{ try{ downloads = await window.claude?.use?.("downloads") ?? null; }catch(e){ downloads = null; } })();

function renderSettings(){
  $("#mode").textContent = "设置";
  $("#view").innerHTML = `
  <div class="panel">
    <h2>备份进度</h2>
    <p class="muted small">学习记录只存在这个浏览器里。换设备或清理浏览器前先导出一份备份，到新设备上再导入。备份和 GitHub Pages 版通用，两边可以互相导入。</p>
    <div class="row spread">
      <span class="muted small" id="bakState"></span>
      <div class="row">
        <button class="btn" data-act="export">导出备份</button>
        <label class="btn" style="display:inline-flex">导入备份<input id="bakFile" type="file" accept=".json,application/json" hidden></label>
      </div>
    </div>
    <textarea id="bakOut" readonly hidden style="min-height:120px;font-family:var(--mono);font-size:12px"></textarea>
  </div>
  <div class="panel">
    <h2>导出为 Skill</h2>
    <p class="muted small">把你拿到 🌸 的句子和常忘的单词打包成 SKILL.md，装进 Claude 的 Skills。以后让它帮你写英文，它会用你熟悉的单词和句式。</p>
    <div class="row spread">
      <span class="muted small" id="skillState"></span>
      <div class="row">
        <button class="btn" data-act="skillcopy">复制</button>
        <button class="btn primary" data-act="skilldl">下载 SKILL.md</button>
      </div>
    </div>
    <textarea id="skillOut" readonly hidden style="min-height:160px;font-family:var(--mono);font-size:12px"></textarea>
  </div>
  <div class="row"><button class="btn" data-act="back">返回学习</button></div>`;
}
function stamp(){ const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; }
function showText(outId, text, st, msg){
  const t = $(outId); t.hidden = false; t.value = text; t.focus(); t.select();
  st.textContent = msg;
}
async function offerFile(filename, text, outId, stId){
  const st = $(stId);
  if(!downloads){ showText(outId, text, st, "这里没法直接下载，已显示全文，请复制保存"); return; }
  try{ await downloads.save({filename, data:text}); st.textContent = "已保存"; }
  catch(e){
    if(e?.code==="declined") st.textContent = "已取消";
    else if(e?.code==="rate_limited") st.textContent = "已经有一个保存窗口打开了";
    else showText(outId, text, st, "没法下载，已显示全文，请复制保存");
  }
}
const backupText = () => JSON.stringify({app:"wordforge", v:1, state:S});
let pendingImport = null;
async function importBackup(file){
  const st = $("#bakState");
  try{
    const d = JSON.parse(await file.text());
    if(d?.app!=="wordforge" || !d.state?.cards || !Array.isArray(d.state?.bank)) throw 0;
    pendingImport = d.state;
    st.innerHTML = `导入会覆盖这里的进度。<button class="btn" data-act="importok" style="padding:2px 8px">确认导入</button>`;
  }catch(e){ st.textContent = "这不是 Luka Vocabulary 导出的备份文件"; }
}
async function copyText(text, outId, stId){
  const st = $(stId);
  try{ await navigator.clipboard.writeText(text); st.textContent = "已复制"; }
  catch(e){ showText(outId, text, st, "没法直接复制，已选中全文，请手动复制"); }
}
function skillText(){
  const cards = Object.values(S.cards);
  const good = cards.filter(c=>c.flowers?.length).map(c=>({w:c.w, s:c.flowers.map(f=>f.s)}));
  const weak = cards.filter(c=>(c.lapses||0)>0 || c.ease<2.2).map(c=>c.w);
  return `---
name: my-english-vocabulary
description: My English vocabulary and the sentences I can already say correctly. Use it whenever you write English for me to read aloud, say, or learn from, so the text matches my level and reuses words I know.
---

# My English vocabulary

I am a Chinese learner practicing spoken American English (IELTS core words).

When you write English for me:
- Prefer the words and sentence patterns in "Sentences I can say" below.
- Keep other vocabulary at about the same level; avoid rare words and idioms.
- Keep sentences short and natural for speaking.
- Words in "Words I keep forgetting" are worth reusing so I practice them.

## Sentences I can say
${good.length ? good.map(g=>`- **${g.w}**: ${g.s.join(" / ")}`).join("\n") : "- (none yet)"}

## Words I keep forgetting
${weak.length ? weak.join(", ") : "(none yet)"}
`;
}

/* ---------------- actions ---------------- */
async function submit(){
  const cur = current(); if(!cur || busy || !sample) return;
  const {item} = cur;
  const text = $("#sent").value.trim().replace(/\s+/g," ");
  const st = $("#aistate");
  if(!text){ st.textContent = "先写一个句子"; return; }
  const card = S.cards[item.w];
  const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]/g,"").trim();
  if((card?.flowers||[]).some(f=>norm(f.s)===norm(text))){ st.textContent = "这句之前写过了，换一个新句子"; return; }
  if(rec) rec.stop();
  busy = true; syncAi(); st.textContent = "AI 正在看你的句子…";
  try{
    const r = await judge(item.w, meaningOf(item.w), text);
    busy = false;
    const t = {sentence:text, ...r};
    item.tries.push(t);
    if(r.verdict==="good"){
      item.draft = "";
      finishItem(cur, text);
      save(); advancing = true;
      renderWithVerdict(item, t);
      setTimeout(()=>{ advancing = false; render(); }, 1800);
    }else{
      item.poops++; item.draft = text; save(); render();
    }
  }catch(e){
    busy = false; syncAi();
    st.textContent = errCopy(e); syncAi();
  }
}
function finishItem(cur, sentence){
  const {item} = cur;
  let card = S.cards[item.w];
  if(!card) card = S.cards[item.w] = {w:item.w, reps:0, ease:2.5, interval:0, due:dayNum(), lapses:0, flowers:[]};
  card.flowers.push({s:sentence, d:dayNum()});
  if(cur.list==="plan") schedule(card, item);
  else{
    // extra practice outside the schedule: keep the interval, but a struggle pulls the word back to tomorrow
    card.bonusDay = [dayNum()];
    if(item.poops >= 2){ card.due = Math.min(card.due, dayNum()+1); card.ease = Math.max(1.3, card.ease-0.15); }
  }
  item.done = true;
}
function renderWithVerdict(item, t){
  // keep the finished word on screen with its flower until the auto-advance
  const box = $("#view .panel");
  const ta = $("#sent"), sb = $("#submit");
  if(ta) ta.disabled = true; if(sb) sb.disabled = true;
  const old = box.querySelector(".verdict"); if(old) old.remove();
  const wrap = document.createElement("div"); wrap.innerHTML = verdictHTML(t);
  sb.closest(".row").after(wrap.firstElementChild);
}

$("#view").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || advancing) return;
  const cur = current();
  switch(b.dataset.act){
    case "say": if(cur) speak(cur.item.w); break;
    case "show": if(cur){ cur.item.level = 2; revealed = cur.item.w; save(); render(); $("#sent")?.focus(); } break;
    case "submit": submit(); break;
    case "mic": toggleMic(); break;
    case "back": view = "learn"; render(); break;
    case "export": offerFile(`Luka-Vocabulary-备份-${stamp()}.json`, backupText(), "#bakOut", "#bakState"); break;
    case "importok": if(pendingImport){ S = pendingImport; pendingImport = null; save(); view = "learn"; render(); } break;
    case "skilldl": offerFile("SKILL.md", skillText(), "#skillOut", "#skillState"); break;
    case "skillcopy": copyText(skillText(), "#skillOut", "#skillState"); break;
  }
});
$("#view").addEventListener("change", e=>{
  if(e.target.id==="bakFile" && e.target.files[0]) importBackup(e.target.files[0]);
});
$("#setBtn").addEventListener("click", ()=>{
  if(advancing || busy) return;
  view = view==="settings" ? "learn" : "settings"; render();
});
$("#view").addEventListener("input", e=>{
  if(e.target.id !== "sent") return;
  const cur = current(); if(cur){ cur.item.draft = e.target.value; save(); }
});
$("#view").addEventListener("keydown", e=>{
  if(e.target.id==="sent" && e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); submit(); }
});

// refresh when the hour (bonus batch) or the day (plan) rolls over
let lastKey = hourKey();
setInterval(()=>{
  const k = hourKey();
  if(view!=="learn") return;
  if(k !== lastKey){ lastKey = k; if(!busy && !advancing) render(); }
  else if(!busy && !advancing && !current()) render();
}, 30000);

render();
</script>
